<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Минфин Россия Онлайн — генератор лицензий</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#eaf1f5;background:#0c1420}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #263443;background:#111e2a;padding:20px max(20px,calc((100vw - 1310px)/2));display:flex;align-items:center;gap:14px}header .brand{background:#174f49;border-radius:12px;padding:10px;font-size:28px}header b{font-size:20px}header small{display:block;color:#8fa6b4;margin-top:3px}.wrap{max-width:1350px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:minmax(330px,430px) minmax(450px,1fr);gap:22px}.pane{background:#142230;border:1px solid #293b49;border-radius:17px;padding:22px;box-shadow:0 10px 40px #0002}h2{margin:0 0 7px;font-size:19px}.sub{color:#99aebb;font-size:13px;margin:0 0 20px;line-height:1.5}label{display:block;font-size:13px;color:#c3d4dc;font-weight:650;margin:0 0 6px}.field{margin:0 0 15px}input,select,textarea{width:100%;background:#0c1823;border:1px solid #344858;border-radius:9px;padding:11px 12px;color:#f0f6f8;font:inherit;font-size:14px;outline:none}input:focus,select:focus,textarea:focus{border-color:#52ac91}textarea{resize:vertical;min-height:62px}select{cursor:pointer}option{background:#152332} .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary{background:#0e302d;border:1px solid #2c685c;border-radius:10px;padding:13px;margin:16px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.summary span{font-size:13px;color:#b6d9d0}.summary strong{font-size:22px;color:#f3f9f4}.actions{display:flex;gap:9px;flex-wrap:wrap}button{border:0;border-radius:10px;background:#35aa83;color:#061a16;padding:12px 17px;font-weight:800;cursor:pointer;font-size:14px}button:hover{filter:brightness(1.07)}button.secondary{background:#2b3b4a;color:#e5f2f7}.preview{background:#e6e9e7;border-radius:10px;padding:12px}canvas{width:100%;height:auto;display:block;background:white;box-shadow:0 3px 15px #0002}.foot{font-size:12px;color:#98aebb;margin-top:13px;line-height:1.5}.pill{font-size:11px;border:1px solid #3b645f;background:#143a36;color:#a2e3cb;border-radius:99px;padding:5px 9px;margin-left:auto}@media(max-width:950px){.wrap{grid-template-columns:1fr}.pane{padding:17px}}@media(max-width:500px){.two{grid-template-columns:1fr}header b{font-size:16px}}
</style></head><body>
<header><div class="brand">⚖</div><div><b>МИНФИН · РОССИЯ ОНЛАЙН</b><small>Генератор лицензий</small></div></header>
<main class="wrap"><section class="pane"><h2>Оформление лицензии</h2><p class="sub">Заполни поля — справа сразу появится готовый бланк. Скачивание в PNG одной кнопкой.</p>
<div class="field"><label for="kind">Тип лицензии</label><select id="kind"><option value="ip">Индивидуальный предприниматель</option><option value="small">Малое предприятие</option><option value="medium">Среднее предприятие</option><option value="large">Крупная организация</option></select></div>
<div class="two"><div class="field"><label for="owner">ФИО владельца</label><input id="owner" maxlength="70" placeholder="Иван Иванов"></div><div class="field"><label for="passport">Номер паспорта</label><input id="passport" maxlength="35" placeholder="Например, 93112"></div></div>
<div class="field" id="companyField" hidden><label for="company">Название предприятия</label><input id="company" maxlength="90" placeholder="ООО «Пример»"></div>
<div class="field"><label for="activity">Вид деятельности</label><input id="activity" maxlength="110" placeholder="Например, аренда транспортных средств"></div>
<div class="two"><div class="field"><label for="number">Номер лицензии</label><input id="number" maxlength="40" placeholder="Номер лицензии"></div><div class="field"><label for="date">Дата выдачи</label><input id="date" type="date"></div></div>
<div class="two"><div class="field" id="termField"><label for="term">Срок действия ИП</label><select id="term"><option value="7">7 дней — 7 000 ₽</option><option value="14" selected>14 дней — 13 000 ₽</option><option value="21">21 день — 19 000 ₽</option><option value="28">28 дней — 25 000 ₽</option></select></div><div class="field"><label for="signer">Выдал сотрудник</label><input id="signer" maxlength="70" placeholder="ФИО сотрудника Минфина"></div></div>
<div class="field"><label for="note">Дополнительная информация (необязательно)</label><textarea id="note" maxlength="250" placeholder="Особые условия, примечания"></textarea></div>
<div class="summary"><span>Стоимость лицензии<br><small id="taxInfo"></small></span><strong id="price">13 000 ₽</strong></div>
<div class="actions"><button id="download">⬇ Скачать лицензию PNG</button></div>
</section>
<section class="pane"><h2>Предпросмотр документа</h2><p class="sub">Белый бланк в высоком разрешении — изображение будет чётким в Discord.</p><div class="preview"><canvas id="doc" width="1300" height="1020" aria-label="Предпросмотр лицензии"></canvas></div></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('doc'),ctx=c.getContext('2d');const fields=['kind','owner','passport','company','activity','number','date','term','signer','note'];const R={ip:{name:'ИНДИВИДУАЛЬНЫЙ ПРЕДПРИНИМАТЕЛЬ',prices:{7:7000,14:13000,21:19000,28:25000}},small:{name:'МАЛОЕ ПРЕДПРИЯТИЕ',price:40000,tax:15000,cycle:'ежемесячно'},medium:{name:'СРЕДНЕЕ ПРЕДПРИЯТИЕ',price:100000,tax:50000,cycle:'ежемесячно'},large:{name:'КРУПНАЯ ОРГАНИЗАЦИЯ',price:100000,tax:50000,cycle:'каждые 15 дней'}};const fmt=n=>n.toLocaleString('ru-RU')+' ₽';const fmtDate=s=>{if(!s)return '—';let [y,m,d]=s.split('-').map(Number);return `${String(d).padStart(2,'0')}.${String(m).padStart(2,'0')}.${y}`};const endDate=(s,d)=>{if(!s)return '—';const [y,m,dd]=s.split('-').map(Number);const x=new Date(Date.UTC(y,m-1,dd));x.setUTCDate(x.getUTCDate()+d);return `${String(x.getUTCDate()).padStart(2,'0')}.${String(x.getUTCMonth()+1).padStart(2,'0')}.${x.getUTCFullYear()}`};const text=(str,x,y,size=24,color='#253d4a',bold=false,align='left')=>{ctx.font=`${bold?'700':'400'} ${size}px Arial,sans-serif`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(str,x,y)};const line=(x,y,x2,y2,color='#b1c7b8',width=2)=>{ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()};const wrap=(str,x,y,maxW,fontSize,lineH,maxLines=2)=>{ctx.font=`400 ${fontSize}px Arial,sans-serif`;let words=String(str).split(/\s+/),row='',n=0;for(const w of words){let next=row?row+' '+w:w;if(ctx.measureText(next).width>maxW&&row){text(row,x,y+n*lineH,fontSize);n++;row=w;if(n>=maxLines)return;}else row=next;}if(row&&n<maxLines)text(row,x,y+n*lineH,fontSize)};const noteLines=(value,maxWidth=1080,fontSize=21)=>{ctx.font=`400 ${fontSize}px Arial,sans-serif`;const result=[];let line="";for(const word of String(value).split(/\s+/).filter(Boolean)){let chunk="";for(const char of word){if(ctx.measureText(chunk+char).width>maxWidth&&chunk){if(line){result.push(line);line=""}result.push(chunk);chunk=char}else chunk+=char}if(!chunk)continue;const test=line?line+" "+chunk:chunk;if(ctx.measureText(test).width>maxWidth&&line){result.push(line);line=chunk}else line=test}if(line)result.push(line);return result};const ipName=full=>{const parts=String(full).trim().split(/\s+/).filter(Boolean);if(!parts.length)return "Не указано";return "ИП "+parts[0]+(parts[1]?" "+parts[1][0].toUpperCase()+".":"")};const row=(label,value,y)=>{text(label,110,y,22,'#55716b');wrap(value||'Не указано',480,y,700,23,30,2)};
function render(){let k=$('kind').value,r=R[k],term=+$('term').value,price=k==='ip'?r.prices[term]:r.price;$('companyField').hidden=k==='ip';$('termField').hidden=k!=='ip';$('price').textContent=fmt(price);$('taxInfo').textContent=k==='ip'?'Налог: 7 500 ₽ каждую неделю':`Налог: ${fmt(r.tax)} ${r.cycle}`;
const hasNote=Boolean($('note').value.trim());const lines=hasNote?noteLines($('note').value.trim()):[];c.height=Math.max(1100,1100+lines.length*29);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#285d50';ctx.lineWidth=7;ctx.strokeRect(24,24,1252,c.height-48);ctx.strokeStyle='#b4c9be';ctx.lineWidth=2;ctx.strokeRect(39,39,1222,c.height-78);
ctx.fillStyle='#124e43';ctx.fillRect(70,68,105,105);text('РО',122,132,43,'#fff',true,'center');text('МИНИСТЕРСТВО ФИНАНСОВ',205,105,35,'#164c42',true);text('РОССИЯ ОНЛАЙН',205,142,23,'#5d7872');line(75,202,1225,202,'#4d9478',4);
text('ЛИЦЕНЗИЯ',650,267,48,'#183e38',true,'center');text('на осуществление предпринимательской деятельности',650,308,25,'#4c6c66',false,'center');text(r.name,650,355,25,'#31564d',true,'center');text('№ '+($('number').value.trim()||'НЕ УКАЗАН'),650,407,28,'#233c42',true,'center');line(90,434,1210,434);
row('Владелец:', $('owner').value,478);row('Паспорт:', $('passport').value,533);if(k!=='ip'){row('Предприятие:', $('company').value,588)}else{row('Наименование ИП:',ipName($('owner').value),588)}row('Дата выдачи:',fmtDate($('date').value),642);if(k==='ip'){row('Срок действия:',term+' дней (до '+endDate($('date').value,term)+')',696)}else{row('Налоговый период:',r.cycle,696)}
row('Налог и период:',k==='ip'?fmt(7500)+' каждую неделю':fmt(r.tax)+' '+r.cycle,750);line(90,793,1210,793);text('Вид деятельности:',110,835,21,'#55716b');wrap($('activity').value||'Не указан',375,835,820,21,27,2);
text('Выдал: '+($('signer').value.trim()||'_______________________'),110,927,21,'#354b4a');if(hasNote){line(90,955,1210,955,'#cddbd4',1);text('Примечание:',110,986,21,'#55716b',true);lines.forEach((item,i)=>text(item,110,1022+i*29,21,'#253d4a'))}
}
fields.forEach(id=>$(id).addEventListener('input',render));$('kind').addEventListener('change',render);$('download').addEventListener('click',()=>{render();const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='Лицензия_'+($('number').value.trim()||'Россия-Онлайн').replace(/[^\w\-а-яёА-ЯЁ]/g,'_')+'.png';a.click()});const today=new Date();$('date').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');render()})();
</script></body></html>
